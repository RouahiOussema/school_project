# ==========================================
# Configuration de la base de données H2
# ==========================================

# URL de la base de données H2 en mémoire
spring.datasource.url=jdbc:h2:mem:schooldb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Créer automatiquement les tables au démarrage
spring.jpa.hibernate.ddl-auto=create-drop

# Afficher les requêtes SQL dans la console (utile pour déboguer)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Activer la console H2 (pour voir la base de données dans le navigateur)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
server.PORT = 8082
